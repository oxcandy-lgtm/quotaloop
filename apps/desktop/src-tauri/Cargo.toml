[package]
name = "quotaloop"
version = "0.1.0-beta.0"
description = "Local-first AI quota dashboard"
authors = ["QuotaLoop contributors"]
edition = "2021"

[lib]
name = "quotaloop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = true, features = ["json", "stream"] }
keyring = { version = "4.1.4", default-features = false, features = ["v1", "apple-native-keyring-store", "windows-native-keyring-store"] }
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
